<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="display">
            
            <input type="text" id="input" placeholder="0" disabled value="">
        </div>

        <div class="buttons">
            
            <button class="btn-top" onclick="allClear()">AC</button>
            <button class="btn-top" onclick="toggleSign()">+/-</button>
            <button class="btn-top" onclick="percentage()">%</button>
            <button class="btn-op" onclick="addOperator('/')">/</button>

            
            <button class="btn-num" onclick="addNumber(7)">7</button>
            <button class="btn-num" onclick="addNumber(8)">8</button>
            <button class="btn-num" onclick="addNumber(9)">9</button>
            <button class="btn-op" onclick="addOperator('*')">×</button>

            
            <button class="btn-num" onclick="addNumber(4)">4</button>
            <button class="btn-num" onclick="addNumber(5)">5</button>
            <button class="btn-num" onclick="addNumber(6)">6</button>
            <button class="btn-op" onclick="addOperator('-')">−</button>

            
            <button class="btn-num" onclick="addNumber(1)">1</button>
            <button class="btn-num" onclick="addNumber(2)">2</button>
            <button class="btn-num" onclick="addNumber(3)">3</button>
            <button class="btn-op" onclick="addOperator('+')">+</button>

            
            <button class="btn-num zero-btn" onclick="addNumber(0)">0</button>
            <button class="btn-num" onclick="addNumber('.')">.</button>
            <button class="btn-op" onclick="calculate()">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
